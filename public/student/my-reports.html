<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Reports — FixFlow</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-content">
      <div class="brand-logo">
        ⚡ FixFlow <span class="badge" style="background: #3b82f6;">Student Portal</span>
      </div>
      <div class="nav-links">
        <a href="/student/dashboard.html">Dashboard</a>
        <a href="/student/report.html">Report Issue</a>
        <a href="/student/my-reports.html" style="font-weight: 600; color: #fff;">My Reports</a>
      </div>
      <div class="nav-user">
        <button onclick="auth.logout()" class="btn btn-outline btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
    <!-- Header with Filter Controls -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem;">
      <div>
        <h1 style="font-size: 1.85rem; margin-bottom: 0.35rem;">My Reported Issues</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">
          Track live progress, technician assignments, and resolution notes for your tickets.
        </p>
      </div>
      <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
        <div>
          <select id="status-filter" class="form-control" style="width: auto; min-width: 170px;">
            <option value="">All Statuses</option>
            <option value="Open">Open</option>
            <option value="Assigned">Assigned</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
          </select>
        </div>
        <a href="/student/report.html" class="btn btn-primary">
          ➕ New Report
        </a>
      </div>
    </div>

    <!-- Reports Container -->
    <div id="my-reports-container">
      <!-- Injected by student.js -->
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/student.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initMyReports();
    });
  </script>
</body>
</html>
