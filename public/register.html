<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — FixFlow Campus Issue Platform</title>
  <meta name="description" content="Register as a student to report and track campus infrastructure issues with AI assistance." />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="brand-logo" style="justify-content: center; margin-bottom: 0.5rem;">
          ⚡ FixFlow <span class="badge">Student Registration</span>
        </div>
        <p style="color: var(--text-muted); font-size: 0.9rem;">
          Join your campus community to report and resolve issues faster
        </p>
      </div>

      <div id="alert-box" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-md); margin-bottom: 1.25rem; font-size: 0.875rem;"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input
            type="text"
            id="name"
            class="form-control"
            placeholder="e.g., Aarav Patel"
            required
            minlength="2"
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Campus Email</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="e.g., yourname@university.edu"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (min 8 characters)</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="••••••••"
            required
            minlength="8"
            autocomplete="new-password"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            class="form-control"
            placeholder="••••••••"
            required
            minlength="8"
            autocomplete="new-password"
          />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 0.5rem;">
          Create Student Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
        Already have an account? <a href="/index.html" style="font-weight: 600;">Sign In</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const submitBtn = document.getElementById('submit-btn');
      const alertBox = document.getElementById('alert-box');

      alertBox.style.display = 'none';

      if (password !== confirmPassword) {
        alertBox.style.display = 'block';
        alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
        alertBox.style.color = '#f87171';
        alertBox.style.border = '1px solid rgba(239, 68, 68, 0.3)';
        alertBox.textContent = 'Passwords do not match.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Creating Account...';

      try {
        const res = await auth.register(name, email, password);
        api.setToken(res.access_token);
        api.setUser(res.user);
        showToast('Registration successful! Welcome to FixFlow.', 'success');
        setTimeout(() => {
          auth.redirectByRole('student');
        }, 500);
      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.style.background = 'rgba(239, 68, 68, 0.15)';
        alertBox.style.color = '#f87171';
        alertBox.style.border = '1px solid rgba(239, 68, 68, 0.3)';
        alertBox.textContent = err.message || 'Registration failed. Please try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Student Account';
      }
    });
  </script>
</body>
</html>
